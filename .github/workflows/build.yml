name: Build Windows x64 ZIP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish framework-dependent ZIP
        shell: pwsh
        run: ./scripts/Publish.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LinkLauncher-build
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
