name: Build Windows x64 ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish framework-dependent ZIP
        shell: pwsh
        run: ./scripts/Publish.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkLauncher-build
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 14
